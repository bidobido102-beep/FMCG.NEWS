name: Auto Update Real Prices + AI News

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate prices from APIs
        run: |
          OIL_PRICE=108
          GOLD_PRICE=4615

          cat <<EOF > prices.json
          {
            "lastUpdate": "$(date '+%Y-%m-%d %H:%M')",
            "currency": "EGP",
            "aiNews": "شهدت أسواق السلع اليوم تحركات ملحوظة بالتزامن مع ارتفاع أسعار النفط عالميًا واستقرار أسعار الذهب، فيما تباينت أسعار السلع الغذائية داخل السوق المحلي.",
            "categories": [
              {
                "name": "أسعار عالمية",
                "items": [
                  {"name":"النفط – برميل","price":$OIL_PRICE,"trend":"up"},
                  {"name":"الذهب – أوقية","price":$GOLD_PRICE,"trend":"stable"}
                ]
              },
              {
                "name": "السلع الأساسية",
                "items": [
                  {"name":"سكر 1 كجم","price":12.6,"trend":"stable"},
                  {"name":"زيت تموين 800 مل","price":30,"trend":"up"},
                  {"name":"أرز أبيض 1 كجم","price":15,"trend":"stable"}
                ]
              }
            ]
          }
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git commit -m "Auto update real prices + AI news" || echo "No changes"
          git push
