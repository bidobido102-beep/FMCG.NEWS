name: Auto Update FMCG Prices

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate prices
        run: |
          cat <<EOF > prices.json
          {
            "lastUpdate": "$(date '+%Y-%m-%d %H:%M')",
            "currency": "EGP",
            "aiNews": "تشير حركة السوق اليوم إلى تغيّرات طفيفة في أسعار السلع، مع ارتفاع بعض المنتجات واستقرار أخرى.",
            "categories": [{
              "name": "السلع الأساسية",
              "items": [
                {"name":"سكر 1 كجم","price":12.6,"trend":"stable"},
                {"name":"زيت تموين 800 مل","price":30,"trend":"up"},
                {"name":"أرز أبيض 1 كجم","price":15,"trend":"stable"},
                {"name":"مكرونة 800 جم","price":13,"trend":"down"}
              ]
            }]
          }
          EOF

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git commit -m "Auto update prices" || echo "No changes"
          git push
