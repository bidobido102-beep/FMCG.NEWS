name: Auto Update Oil & Gold Prices

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch real oil and gold prices
        run: |
          GOLD_PRICE=$(curl -s https://api.metals.live/v1/spot/gold | jq '.[0].gold')
          OIL_PRICE=$(curl -s https://api.metals.live/v1/spot/oil | jq '.[0].oil')

          cat <<EOF > prices.json
          {
            "lastUpdate": "$(date '+%Y-%m-%d %H:%M')",
            "currency": "USD",
            "aiNews": "شهدت الأسواق العالمية اليوم تحركات ملحوظة، حيث ارتفعت أسعار النفط متأثرة بعوامل العرض والطلب، بينما حافظ الذهب على استقرار نسبي وسط ترقب المستثمرين.",
            "categories": [
              {
                "name": "أسعار عالمية",
                "items": [
                  {
                    "name": "النفط الخام (برميل)",
                    "price": $OIL_PRICE,
                    "trend": "up"
                  },
                  {
                    "name": "الذهب (أوقية)",
                    "price": $GOLD_PRICE,
                    "trend": "stable"
                  }
                ]
              },
              {
                "name": "السلع الأساسية",
                "items": [
                  { "name": "سكر 1 كجم", "price": 12.6, "trend": "stable" },
                  { "name": "زيت تموين 800 مل", "price": 30, "trend": "up" },
                  { "name": "أرز أبيض 1 كجم", "price": 15, "trend": "stable" }
                ]
              }
            ]
          }
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git commit -m "Update real oil & gold prices" || echo "No changes"
          git push
