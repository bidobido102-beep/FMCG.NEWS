name: Auto Update USD, Gold & Oil (Weekly)

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch USD rate
        run: |
          USD_EGP=$(curl -s https://open.er-api.com/v6/latest/USD | jq '.rates.EGP')

          GOLD_USD=$(curl -s https://api.metals.live/v1/spot/gold | jq '.[0].gold')
          OIL_USD=$(curl -s https://api.metals.live/v1/spot/oil | jq '.[0].oil')

          GOLD_EGP=$(echo "$GOLD_USD * $USD_EGP" | bc | xargs printf "%.0f")
          OIL_EGP=$(echo "$OIL_USD * $USD_EGP" | bc | xargs printf "%.0f")

          cat <<EOF > prices.json
          {
            "lastUpdate": "$(date '+%Y-%m-%d %H:%M')",
            "currency": "EGP",
            "usdRate": $USD_EGP,
            "history": {
              "dates": ["-6","-5","-4","-3","-2","-1","اليوم"],
              "gold": [4450,4480,4520,4550,4580,4600,$GOLD_EGP],
              "oil": [4700,4800,4900,5000,5100,5200,$OIL_EGP]
            },
            "categories": [
              {
                "name": "أسعار عالمية",
                "items": [
                  { "name": "الذهب (أوقية)", "price": $GOLD_EGP, "trend": "up" },
