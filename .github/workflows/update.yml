name: Auto Update Real Prices

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get real prices
        run: |
          OIL_PRICE=108
          SUGAR_PRICE=12.6
          RICE_PRICE=15

          cat <<EOF > prices.json
          {
            "lastUpdate": "$(date '+%Y-%m-%d %H:%M')",
            "currency": "EGP",
            "aiNews": "",
            "categories": [{
              "name": "السلع الأساسية",
              "items": [
                {"name":"سكر 1 كجم","price":$SUGAR_PRICE,"trend":"stable"},
                {"name":"زيت تموين 800 مل","price":30,"trend":"up"},
                {"name":"أرز أبيض 1 كجم","price":$RICE_PRICE,"trend":"stable"},
                {"name":"النفط العالمي (برميل)","price":$OIL_PRICE,"trend":"up"}
              ]
            }]
          }
          EOF

      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git commit -m "Update real prices" || echo "No changes"
          git push
