<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>FMCG.NEWS | أسعار السلع</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ تحميل Chart.js بشكل صحيح -->
  https://cdn.jsdelivr.net/npm/chart.js

  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
    }

    h1, h2 { color: #222; }

    #updateTime { color: #555; margin-bottom: 10px; }

    .section { margin-bottom: 35px; }

    .section-title {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .price {
      font-size: 22px;
      font-weight: bold;
    }

    .up { color: #1a7f37; }
    .down { color: #cf222e; }
    .stable { color: #57606a; }

    .chart-wrapper {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 600px;
    }

    #news, #alertBox {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    #alertBox {
      display: none;
      background: #fff4e5;
      border: 2px solid #ff9800;
      color: #a85b00;
      font-weight: bold;
    }

    button {
      background: #0969da;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>📊 أسعار السلع اليوم</h1>
<p id="updateTime"></p>

<div id="alertBox"></div>

<div class="section">
  <div class="section-title">🌍 أسعار عالمية</div>
  <div class="cards" id="globalPrices"></div>
</div>

<div class="section">
  <div class="section-title">🇪🇬 سلع أساسية محلية</div>
  <div class="cards" id="localPrices"></div>
</div>

<div class="section">
  <div class="section-title">📈 الرسم البياني الأسبوعي</div>
  <div class="chart-wrapper">
    <canvas id="priceChart" height="60"></canvas>
  </div>
</div>

<div class="section">
  <div class="section-title">📰 خبر السوق</div>
  <div id="news"></div>
</div>

<button onclick="checkTrend()">هل الأسعار ارتفعت أم انخفضت؟</button>
<p id="trendResult"></p>

<footer>
  © FMCG.NEWS – يتم تحديث الأسعار تلقائيًا من مصادر مفتوحة
</footer>

<!-- ✅ ربط ملف JavaScript بشكل صحيح -->
script.js</script>

</body>
</html>
