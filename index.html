<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMCG – السوق المصري</title>

  <!-- تحميل ملف الأسعار -->
  <script src="data.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
    }

    header {
      background: #222;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1e1e1e;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    h3 {
      margin-top: 0;
    }

    p {
      margin: 6px 0;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
    }

    small {
      color: #aaa;
      display: block;
      margin-top: 8px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  📊 FMCG – السوق المصري
</header>

<div class="container">

  <div class="card">
    <h3>🥇 أسعار الذهب</h3>
    <p>عيار 24: <span id="g24" class="price"></span></p>
    <p>عيار 21: <span id="g21" class="price"></span></p>
    <p>عيار 18: <span id="g18" class="price"></span></p>
    <p>جنيه ذهب: <span id="gp" class="price"></span></p>
    <small id="goldSource"></small>
  </div>

  <div class="card">
    <h3>🏗️ أسعار الحديد</h3>
    <p id="steel" class="price"></p>
    <small id="steelSource"></small>
  </div>

  <div class="card">
    <h3>🧱 أسعار الأسمنت</h3>
    <p id="cement" class="price"></p>
    <small id="cementSource"></small>
  </div>

  <div class="card">
    <h3>🏢 شركات السلع الاستهلاكية</h3>
    <p>كوكاكولا: <span id="coca"></span></p>
    <p>بيبسي: <span id="pepsi"></span></p>
    <p>إيديتا: <span id="edita"></span></p>
  </div>

  <div class="card">
    <h3>🚬 أسعار السجائر</h3>
    <p>كليوباترا: <span id="cleo"></span></p>
    <p>مارلبورو: <span id="marl"></span></p>
    <small id="cigSource"></small>
  </div>

  <div class="card">
    <small id="date"></small>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  g24.innerText  = PRICES.gold["24"];
  g21.innerText  = PRICES.gold["21"];
  g18.innerText  = PRICES.gold["18"];
  gp.innerText   = PRICES.gold.pound;
  goldSource.innerText = "المصدر: " + PRICES.gold.source;

  steel.innerText  = PRICES.steel.value;
  steelSource.innerText = "المصدر: " + PRICES.steel.source;

  cement.innerText = PRICES.cement.value;
  cementSource.innerText = "المصدر: " + PRICES.cement.source;

  coca.innerText = PRICES.companies.cocaCola;
  pepsi.innerText = PRICES.companies.pepsi;
  edita.innerText = PRICES.companies.edita;

  cleo.innerText = PRICES.cigarettes.local.cleopatra;
  marl.innerText = PRICES.cigarettes.imported.marlboro;
  cigSource.innerText = "المصدر: " + PRICES.cigarettes.source;

  date.innerText = "آخر تحديث: " + PRICES.lastUpdate;
});
</script>

</body>
</html>
