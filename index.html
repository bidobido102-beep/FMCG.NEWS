<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>FMCG.NEWS | أسعار السلع</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      color: #222;
    }

    #updateTime {
      color: #555;
      margin-bottom: 15px;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
    }

    .up { color: #1a7f37; }
    .down { color: #cf222e; }
    .stable { color: #57606a; }

    /* Chart */
    .chart-wrapper {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 600px;
    }

    /* News */
    #news {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    /* Button */
    .trend-btn {
      background: #0969da;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .trend-btn:hover {
      background: #0550ae;
    }

    #trendResult {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>📊 أسعار السلع اليوم</h1>
  <p id="updateTime"></p>

  <div class="cards" id="prices"></div>

  <h2>📈 الرسم البياني للأسعار</h2>
  <div class="chart-wrapper">
    <canvas id="priceChart" height="60"></canvas>
  </div>

  <h2>📰 خبر السوق</h2>
  <div id="news"></div>

  <button class="trend-btn" onclick="checkTrend()">
    هل الأسعار ارتفعت أم انخفضت؟
  </button>

  <p id="trendResult"></p>

  <footer>
    © FMCG.NEWS – تحديثات يومية لأسعار السلع
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
