<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>آخر زيادات الأسعار</title>

<script src="price-alerts.js"></script>

<style>
body {
  font-family: Arial;
  background:#111;
  color:#fff;
  padding:20px;
}
.card {
  background:#1e1e1e;
  padding:15px;
  margin-bottom:12px;
  border-radius:10px;
}
small {
  color:#aaa;
}
.badge {
  background:#c62828;
  padding:4px 8px;
  font-size:12px;
  border-radius:4px;
  display:inline-block;
  margin-bottom:6px;
}
</style>
</head>

<body>

<h2>🚨 آخر زيادات الأسعار</h2>

<div id="alerts"></div>

<script>
const div = document.getElementById("alerts");

PRICE_ALERTS.forEach(a => {
  div.innerHTML += `
    <div class="card">
      <span class="badge">${a.category}</span>
      <h3>${a.title}</h3>
      <small>${a.source} – ${a.date}</small>
    </div>
  `;
});
</script>

</body>
</html>
